background:#242c38;font-size:12px}.step.done{color:var(--mint);background:#20352f}.step.current{color:var(--amber);background:#3a3125}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:18px}.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-item p{font-size:12px;color:var(--muted);margin-top:4px}.dot{display:inline-block;width:7px;height:7px;background:var(--mint);border-radius:50%;margin-right:7px}.dot.off{background:#778395}.bar{height:4px;background:#2c3643;border-radius:4px;margin-top:10px}.bar i{display:block;height:100%;background:var(--mint);border-radius:4px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{background:#131920;color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:6px;width:180px}.doc{line-height:1.85}.doc h3{margin:17px 0 7px}.doc ul{padding-left:21px;margin:5px 0}.doc li{margin:5px 0}.doc-top{padding-bottom:18px;border-bottom:1px solid var(--line)}.doc-top h2{font-size:21px}.foot-actions{background:#1b242d;border-top:1px solid var(--line);padding:16px 20px}.version{font-size:12px;color:var(--muted);margin:8px 0;overflow-wrap:anywhere}.permission-note{background:#202d29;border-left:3px solid var(--mint);padding:12px 15px;font-size:13px;margin:16px 0}.logs{font:12px/1.9 Consolas,"Microsoft YaHei",monospace;color:#b7c4d5;max-height:220px;overflow:auto;white-space:pre-wrap}.label{display:block;color:var(--muted);font-size:12px;margin:13px 0 5px}.check{accent-color:#7de0bd;width:16px;height:16px}.empty{text-align:center;padding:45px;color:var(--muted)}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(470px,100vw);background:#171e28;border-left:1px solid #41516a;box-shadow:-12px 0 65px #0008;z-index:5;padding:24px;overflow:auto}.backdrop{position:fixed;inset:0;background:#0007;z-index:4}.drawer h2{margin:18px 0 5px}.drawer section{margin:25px 0}.drawer p{margin:7px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border:1px solid #527362;border-radius:8px;background:#253c31;color:#d9f5e8;z-index:10;box-shadow:0 8px 35px #0005;max-width:90vw}dialog{color:var(--text);background:var(--panel);border:1px solid #52687a;border-radius:12px;padding:25px;max-width:470px;width:90vw}dialog::backdrop{background:#0009}dialog p{margin:16px 0;color:#b6c3d4}footer{font-size:11px;color:var(--muted);padding-top:12px}.shell.compact{max-width:470px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.compact .layout{display:block}.compact aside{border:0;padding:12px;display:flex;gap:6px}.compact .eyebrow,.compact .aside-note{display:none}.compact .project{margin:0;padding:8px}.compact #projects{display:flex;width:100%;gap:6px}.compact main{padding:15px}.compact header{padding:12px;height:auto;flex-wrap:wrap}.compact .split{grid-template-columns:1fr}.compact .stats{grid-template-columns:repeat(2,1fr)}.compact .heading{align-items:flex-start;flex-direction:column}.compact .tabs{gap:18px}.compact .identity{flex-wrap:wrap}.compact h1{font-size:20px}[hidden]{display:none!important}@media(max-width:800px){.layout{display:block}aside{display:flex;gap:6px;padding:10px;border:0}#projects{display:flex;width:100%;gap:6px}.eyebrow,.aside-note{display:none}.project{margin:0;padding:8px}main{padding:16px}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:12px;height:auto;flex-wrap:wrap}.heading{flex-wrap:wrap}.identity{flex-wrap:wrap}}@media print{body{background:white;color:black}header,aside,.tabs,.toolbar,.foot-actions,.notice,footer{display:none}.layout,.split{display:block}main{padding:0}.panel,.stat{background:white;border-color:#bbb;color:black}small,.muted,th{color:#555}.table-wrap{overflow:visible}table{white-space:normal}button{display:none}}

</style></head><body><section style="padding:16px;border:2px solid #d48806;background:#fffbe6;color:#332b00"><strong>2026-09-28 实现边界更新：</strong>旧外部任务系统集成及通知调度已移除。业务数据统一由 PostgreSQL 保存，当前保留 Track、原始 HTML 审阅、本机 Agent 配置和 PM 只读分析；正式审批、任务发布及节点派工待实现。下文相关旧命令与兼容性描述仅为历史资料，不再作为操作指导。</section><div class="shell" id="shell">
<header><div class="brand"><b>◈</b> GameAI <span style="font-weight:400;color:#92a2b8">/ Track</span></div><div class="toolbar"><span class="tag amber">交互小样 · 全部模拟数据</span><button class="small ghost" id="widthToggle">预览侧栏宽度</button></div></header>
<div class="layout">
<main><div class="heading row"><div class="project-heading"><h1 id="projectTitle"></h1><span id="projectKey" class="muted mono"></span></div><div class="stats" id="stats"></div><div class="identity"><span>查看身份</span><select id="identity" aria-label="切换模拟身份"><option value="design">策划 · 人工审批人</option><option value="admin">项目管理员</option><option value="art">美术 · 只读</option><option value="dev">开发 · 只读</option><option value="qa">QA · 只读</option><option value="pm">PM · 只读</option></select></div></div>

<nav class="tabs" id="tabs" aria-label="项目页面"></nav><div id="view"></div><footer>本页用于讨论布局与交互；所有数据与操作均为模拟，不调用服务或修改 JIRA。文档审批由授权人员完成，Agent 不自行批准。</footer></main></div></div>
<div id="backdrop" class="backdrop" hidden></div><div id="drawer" class="drawer" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<dialog id="approvalDialog"><h2>批准指定版本</h2><p id="approvalText"></p><div class="permission-note">批准只绑定当前文档版本。后续文档修改必须重新审批，不能沿用本次批准。</div><div class="row" style="margin-top:20px"><button id="cancelApproval">返回审阅</button><button id="confirmApproval" class="primary">确认批准 · 模拟</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const projects=[{key:'AI9527',name:'GameAI · 移动游戏',short:'GameAI',doc:'七日累计登录活动',version:'v1.3',hash:'demo-7day-13-a8f4',approved:false,tasks:[['LOGIN-01','活动弹窗与奖励占位资源','Art','art-01','执行中',65,'无','v1.2'],['LOGIN-02','活动资格与累计登录规则','Development','dev-01','执行中',42,'无','v1.2'],['LOGIN-03','活动弹窗与领取反馈接入','Development','—','依赖阻塞',0,'LOGIN-01','v1.2'],['LOGIN-04','跨日与重复领奖验收','QA','—','等待交付',0,'LOGIN-02、LOGIN-03','v1.2']],agents:[['design-01','Design','空闲','—','0 / 1','设计工作站'],['pm-01','PM','空闲','—','0 / 1','调度工作站'],['art-01','Art','执行中','LOGIN-01','1 / 1','美术工作站'],['dev-01','Development','执行中','LOGIN-02','1 / 2','开发工作站 A'],['dev-02','Development','空闲','—','0 / 1','开发工作站 B'],['qa-01','QA','离线','—','0 / 1','测试工作站']]}];
let pi=0,tab='overview',role='design',filter='全部',query='',selectedVersion='latest',toastTimer;
const audit=[[],[]],grants=[{},{}],writes=[{},{}];
const tabs=[['overview','项目总览'],['requirements','需求与审批'],['tasks','任务与依赖'],['agents','Agent'],['versions','版本'],['permissions','权限'],['audit','操作记录']];
const project=()=>projects[pi];
const badge=s=>'<span class="tag '+(s==='执行中'||s==='已批准'?'green':s.includes('等待')||s.includes('阻塞')||s==='待审批'?'amber':s==='离线'?'gray':'')+'">'+s+'</span>';
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function record(s){audit[pi].unshift([new Date().toLocaleTimeString(),'人工 / '+$('identity').selectedOptions[0].text,s]);}
function panel(title,sub,content,extra=''){return '<section class="panel"><div class="panel-head row wrap"><div><h2>'+title+'</h2><p>'+sub+'</p></div>'+extra+'</div>'+content+'</section>'}
function table(head,rows){return '<div class="table-wrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function tr(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function render(){const p=project();$('projectKey').textContent=p.key;$('projectTitle').textContent=p.name;
$('stats').innerHTML=[['待审批',p.approved?'0':'1','人工门禁'],['执行中',p.agents.filter(a=>a[2]==='执行中').length,'个 Agent'],['阻塞',p.tasks.filter(t=>t[4]==='依赖阻塞'||t[4]==='等待交付').length,'项任务'],['空闲节点',p.agents.filter(a=>a[2]==='空闲').length,'个 Agent']].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');
$('tabs').innerHTML=tabs.map(x=>'<button class="'+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');
const views={overview,requirements,tasks,agents,versions,permissions,history};$('view').innerHTML=(tab==='audit'?history:views[tab])();}
function overview(){const p=project();return panel('当前需求 / '+p.doc,'已发布版本继续执行；新修订版需要单独审批。','<div class="pad"><div class="row wrap"><div><h2>'+p.version+' · '+(p.approved?'已批准，待附件核验':'新增修订，等待人工审阅')+'</h2><p class="muted">'+(pi===0?'v1.2 已发布；v1.3 补充断线恢复与测试邮件规则。':'v0.2 补充升级取消与资源返还规则。')+'</p></div><button class="primary" data-tab="requirements">查看需求</button></div><div class="steps"><span class="step done">01 需求整理</span><span class="step '+(p.approved?'done':'current')+'">02 人工审批</span><span class="step '+(p.approved?'current':'')+'">03 附件核验</span><span class="step">04 PM 拆分</span><span class="step">05 依赖派工</span><span class="step">06 QA 验收</span></div></div>')+'<div class="split">'+panel('执行中的 Agent','只显示本项目中有执行记录的示例节点。',agentTable(p.agents.filter(a=>a[2]==='执行中')), '<button class="small" data-tab="agents">全部 Agent</button>')+panel('需要关注','将阻塞原因放在任务之前。','<div class="pad"><div class="list-item"><span class="tag amber">审批</span><p>'+p.doc+' '+p.version+'：'+(p.approved?'批准已记录，附件尚未核验。':'需要人工审阅新版本。')+'</p></div><div class="list-item"><span class="tag amber">依赖</span><p>'+ (pi===0?'领取反馈接入等待美术资源交付；基础逻辑可以并行。':'验收任务等待升级队列实现。')+'</p></div><div class="list-item"><span class="tag gray">版本</span><p>审批新版本不覆盖旧版本执行；由服务器判定受影响任务。</p></div></div>')+'</div>'+panel('执行动态','模拟事件流；实际将由服务器核验后更新。','<div class="pad logs">10:42:18  [状态] '+p.key+' 项目快照已更新（模拟）\n10:41:03  [版本] '+p.version+' 已提交审阅\n10:40:29  [门禁] 未批准版本禁止创建新执行</div>');}
function requirements(){const p=project(),old=selectedVersion==='old',approved=old&&pi===0||!old&&p.approved,ver=old?(pi===0?'v1.2':'v0.1'):p.version;return panel('需求审阅','审批绑定文件哈希和完整版本；下方为小样节选，不是正式需求正文。','<div class="pad doc"><div class="doc-top"><div class="row wrap"><h2>'+p.doc+'</h2>'+badge(approved?'已批准':old?'历史草案':'待审批')+'</div><div class="version">文档 '+ver+' · '+p.key+' · '+(old?'历史版本，只读':'当前待发布版本')+'<br>版本标识：<span class="mono">'+(old?'demo-history-01':p.hash)+'</span></div></div><h3>1. 设计目标</h3><p>'+ (pi===0?'通过七日累计登录提供明确、可追踪的阶段奖励，引导玩家持续参与。':'通过建筑升级与队列展示，让玩家明确升级成本、等待时间及交付结果。')+'</p><h3>2. 功能综述</h3><ul>'+ (pi===0?'<li>个人活动限时 14 个活动日，累计登录 7 天；账号下角色共享进度。</li><li>活动开启时锁定时区，跨日在线由服务器校验。</li><li>手动领取，未领取的已解锁奖励到期写入测试邮件记录。</li>':'<li>升级前检查资源与队列容量。</li><li>显示等待进度、取消入口及返还结果。</li>')+'</ul><h3>3. 本次版本变更</h3><ul><li>补充断线后的状态核对，不因超时重复发放或扣除。</li><li>补充成功反馈、失败提示和幂等验收用例。</li></ul><h3>4. 交付与审批检查</h3><p>正式页面应展示完整需求、线框及交付标准；审阅时可比对上一版本，批准后才进入附件核验与 PM 拆分。</p><div class="permission-note">'+(role==='design'?'当前为策划人工审批身份，可以批准当前版本或退回修改。':'当前身份只能阅读需求；审批按钮不可用。')+'</div></div><div class="foot-actions row wrap"><span class="muted">'+(approved?'此版本已经批准；重复点击不能重复派工。':'批准后先核验附件，再安排 PM。')+'</span><div class="toolbar"><button data-action="revise" '+(role!=='design'||old||approved?'disabled':'')+'>退回修改</button><button class="primary" data-action="approve" '+(role!=='design'||old||approved?'disabled':'')+'>批准此版本</button></div></div>', '<select id="versionSelect" aria-label="审阅版本"><option value="latest" '+(!old?'selected':'')+'>'+p.version+' 当前版本</option><option value="old" '+(old?'selected':'')+'>'+(pi===0?'v1.2 已发布':'v0.1 历史草案')+'</option></select>');}
function tasks(){const p=project(),rows=p.tasks.filter(t=>(filter==='全部'||t[2]===filter)&&(!query||t.join(' ').toLowerCase().includes(query.toLowerCase())));return panel('任务与依赖','按交付项拆分；未满足的依赖禁止派工。'+(pi===0?' 当前任务使用已批准的 v1.2，新版本不会自动替换。':''),table(['Task','Deliverable','Role','Agent','Status','Dependency','Version'],rows.map(t=>tr(['<button class="link mono" data-task="'+t[0]+'">'+t[0]+'</button>',t[1],t[2],t[3],badge(t[4]),t[6],t[7]])))+(rows.length?'':'<div class="empty">没有符合条件的任务</div>'),'<div class="toolbar"><select id="taskFilter" aria-label="任务角色">'+['全部','Art','Development','QA'].map(v=>'<option '+(filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select><input class="search" id="search" aria-label="搜索任务" placeholder="搜索任务 / Agent"></div>');}
function agentTable(list){return table(['Agent','Role','Status','Task','Capacity'],list.map(a=>tr(['<button class="link mono" data-agent="'+a[0]+'">'+a[0]+'</button>',a[1],badge(a[2]),a[3],a[4]])))+(list.length?'':'<div class="empty">当前没有执行中的 Agent</div>');}
function agents(){return panel('项目 Agent','角色可以有多个实例；工作站、容量与执行编号用于区分实际执行。',agentTable(project().agents))+'<div class="permission-note">补充建议：离线节点不再接新任务；已启动的任务先核实执行结果，不能立即交给另一个 Agent 重跑。点击 Agent 查看授权与工作站。</div>';}
function versions(){const p=project();return panel('需求版本','保留批准版本及交付引用；恢复旧内容需要产生新版本并重新审批。',table(['Version','State','Change','Approved by','References','Action'],[tr([p.version,badge(p.approved?'已批准':'待审批'),'异常恢复与测试用例',p.approved?'策划人工审批人（模拟）':'—',p.approved?'附件待核验':'尚未派工','<button class="link" data-version="latest">审阅</button>']),tr([pi===0?'v1.2':'v0.1',badge(pi===0?'已批准':'历史草案'),pi===0?'基础规则与 UI 交付标准':'初始规则',pi===0?'示例审批人':'—',pi===0?'4 项任务 · 2 项执行中':'无执行','<button class="link" data-version="old">查看</button>'])]))+panel('版本之间的关系','每个任务都必须明确使用哪份需求、计划和产物。','<div class="pad"><div class="steps"><span class="step done">需求版本</span><span class="step">PM 计划版本</span><span class="step">任务执行编号</span><span class="step">代码 / 美术产物版本</span><span class="step">QA 验收版本</span></div><p class="muted" style="margin-top:15px">新需求发布时列出受影响任务，保留历史记录；不自动把正在执行的旧任务标记为最新版本完成。</p></div>');}
function permissions(){const p=project(),isAdmin=role==='admin';return panel('权限配置','按项目隔离。当前小样的默认策略：策划人工身份负责文档审批，其余专业角色只读。', '<div class="pad"><div class="permission-note">'+(isAdmin?'管理员可调整节点的读取和任务写入权限；写入仍受任务授权约束，人工审批权限不授予自动 Agent。':'当前为权限预览。切换顶部“查看身份”为项目管理员可体验配置。')+'</div></div>'+table(['Identity / Role','Read status','Read document','Approve document','Manage access'],[['策划 · 人工','允许','允许','允许','禁止'],['PM / 美术 / 开发 / QA','允许','允许','禁止','禁止'],['项目管理员','允许','允许','禁止','允许']].map(tr)))+panel('具体 Agent 授权','只读面板权限与后台执行写入范围分离；执行写入必须有有效任务授权。',table(['Agent','Role','Read project','Write assigned task','Approve','Execution write scope'],p.agents.map(a=>tr([a[0],a[1],'<input class="check" type="checkbox" aria-label="'+a[0]+' 查看项目" data-grant="'+a[0]+'" '+(grants[pi][a[0]]===false?'':'checked')+' '+(!isAdmin?'disabled':'')+'>','<input class="check" type="checkbox" aria-label="'+a[0]+' 写入授权任务" data-write="'+a[0]+'" '+(writes[pi][a[0]]===false?'':'checked')+' '+(!isAdmin?'disabled':'')+'>','禁止 · 需人工',({Design:'提交需求修订稿',PM:'创建授权范围的子任务',Art:'提交本任务美术产物',Development:'提交本任务代码产物',QA:'提交本任务验收证据'})[a[1]]]))), '<span class="tag gray">修改仅在本页模拟</span>')+'<p class="muted">建议采用“角色默认权限 + Agent 明确授权 + 项目范围”的交集。隐藏按钮只是展示，真实读写必须由服务端再次校验。</p>';}
function history(){const p=project();return panel('操作记录','记录实际操作者、目标版本与结果；刷新页面会清除本次模拟记录。',table(['Time','Actor','Event'],[...audit[pi],['10:41:03','Design Agent（示例）',p.version+' 提交审阅'],['10:40:29','编排服务（示例）','检查版本门禁，未启动新任务']].map(tr)));}
function drawer(title,body){$('drawer').innerHTML='<div class="row"><span class="eyebrow">'+project().key+' / 详情</span><button data-action="close">关闭</button></div><h2>'+title+'</h2>'+body;$('drawer').hidden=false;$('backdrop').hidden=false;}
function closeDrawer(){$('drawer').hidden=true;$('backdrop').hidden=true;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){tab=b.dataset.tab;filter='全部';query='';render();}if(b.dataset.version){selectedVersion=b.dataset.version;tab='requirements';render();}if(b.dataset.task){const t=project().tasks.find(t=>t[0]===b.dataset.task);drawer(t[0]+' · '+t[1],'<p>'+badge(t[4])+' '+t[2]+'</p><section><h3>执行上下文</h3><p>需求版本：'+t[7]+'</p><p>负责 Agent：'+t[3]+'</p><p>前置依赖：'+t[6]+'</p><p>交付进度：'+t[5]+'%（模拟）</p><div class="bar"><i style="width:'+t[5]+'%"></i></div></section><section><h3>交付检查</h3><p>产物路径、验证结果和输入版本一致后，才能提交交付。</p><p class="muted">当前示例没有真实文件或验收证据。</p></section><section><h3>执行记录</h3><div class="logs">'+(t[3]==='—'?'尚未启动；等待门禁满足。':'已分配给 '+t[3]+'（模拟）。\n正在处理指定版本的任务。')+'</div></section>');}if(b.dataset.agent){const a=project().agents.find(a=>a[0]===b.dataset.agent);drawer(a[0],'<p>'+a[1]+' · '+badge(a[2])+'</p><section><h3>节点信息</h3><p>工作站：'+a[5]+'</p><p>容量使用：'+a[4]+'</p><p>当前任务：'+a[3]+'</p><p>连接：'+(a[2]==='离线'?'已离线，待核实':'最近心跳 5 秒前（模拟）')+'</p></section><section><h3>有效授权</h3><p>项目范围：'+project().key+'</p><p>面板读取：'+(grants[pi][a[0]]===false?'禁止':'允许')+'</p><p>文档审批：禁止，交给人工审批人</p><p>执行写入：'+(writes[pi][a[0]]===false?'禁止':'仅限服务器分配的任务')+'</p></section>');}if(b.dataset.action==='close')closeDrawer();if(b.dataset.action==='approve'){$('approvalText').textContent='你将以策划人工审批身份批准「'+project().doc+'」'+project().version+'。版本标识：'+project().hash+'。此次仅模拟审批，不会启动任务。';$('approvalDialog').showModal();}if(b.dataset.action==='revise'){record('将 '+project().version+' 退回修改（模拟）');toast('已记录退回修改；本小样保留原稿供继续体验。');}});
document.addEventListener('change',e=>{if(e.target.id==='versionSelect'){selectedVersion=e.target.value;render();}if(e.target.id==='taskFilter'){filter=e.target.value;render();}if(e.target.dataset.write){if(role!=='admin')return;writes[pi][e.target.dataset.write]=e.target.checked;record((e.target.checked?'授予 ':'撤销 ')+e.target.dataset.write+' 的任务写入权限（模拟）');toast('任务写入权限已在当前页面模拟更新');}if(e.target.dataset.grant){if(role!=='admin')return;grants[pi][e.target.dataset.grant]=e.target.checked;record((e.target.checked?'授予 ':'撤销 ')+e.target.dataset.grant+' 的项目读取权限（模拟）');toast('权限已在当前页面模拟更新');}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('search').value=query;$('search').focus();$('search').setSelectionRange(pos,pos);}});
$('identity').onchange=e=>{role=e.target.value;render();};$('widthToggle').onclick=()=>{const compact=$('shell').classList.toggle('compact');$('widthToggle').textContent=compact?'恢复宽屏预览':'预览侧栏宽度';};$('backdrop').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});$('cancelApproval').onclick=()=>$('approvalDialog').close();$('confirmApproval').onclick=()=>{if(role!=='design'||selectedVersion!=='latest'||project().approved)return;project().approved=true;record('批准 '+project().version+' / '+project().hash+'（模拟）；等待附件核验');$('approvalDialog').close();render();toast('模拟批准成功；未创建任务，未启动 Agent。');};render();
</script></body></html>
